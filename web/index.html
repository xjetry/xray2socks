<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xray2Socks</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div><p class="eyebrow">LOCAL NETWORK TOOL</p><h1>Xray<span>2</span>Socks</h1><p class="sub">把远端代理接入本地 SOCKS5</p></div><div id="status" class="status"><i></i>检查中</div></header>
